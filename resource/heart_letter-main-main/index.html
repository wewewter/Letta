<!DOCTYPE html>
<html lang="en" >
<head>
<meta charset="UTF-8">
<title>heart letter by alexx_deev</title>
<link rel="stylesheet" href="./style.css">
<script src="https://unpkg.com/@tailwindcss/browser@4"></script>

</head>
<body>
<div class="envlope-wrapper">
    <div id="envelope" class="close">
        <div class="front flap"></div>
        <div class="front pocket"></div>
        <div class="letter">
            <b>
            <div class="words line1">From Ray</div>
            <div class="words line2">Happy Valentine's</div>
            <div class="words line3"><center>Cutie Melody</center></div>
            <div class="words line4"></div>
            </b>
        </div>
        <div class="hearts">
            <div class="heart a1"></div>
            <div class="heart a2"></div>
            <div class="heart a3"></div>
            <div class="heart a4"></div>
            <div class="heart a5"></div>
        </div>
    </div>
</div>
<div class="reset">
    <button id="open">Open</button>
    <button id="reset">Close</button>
</div>
