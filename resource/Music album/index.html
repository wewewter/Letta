<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Album</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="h-screen bg-[url('../img/musicbackground.jpg')] bg-cover">
    <h1 class="font-bold text-5xl mt-3 text-white"><center>Music</center></h1>
    <div class="p-6 bg-gray-500 w-68 mx-auto mt-7 rounded-3xl">
        <div class="card-content">
            <img src="../img/music1.jpg" alt="" class="w-56 rounded-3xl">
            <p class="font-bold text-white">Last day on earth <br> Green Day</p>
            <br>
            <audio controls autoplay src="../audio/Last Night on Earth.mp3" class="mt-2 w-56 "></audio>
        </div>
    </div>
    <div class="p-6 bg-gray-500 w-68 mx-auto mt-7 rounded-3xl">

        </div>
    </div>
